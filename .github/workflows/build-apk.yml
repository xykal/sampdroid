name: Build APK

on:
  push:
    # `ci/**` is an explicit debug-validation lane. It never satisfies the
    # tag-only official release condition below, but lets a maintained native
    # batch compile both Android ABIs before any draft-release decision.
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PR build hanya perlu membaca source. Hak tulis release diisolasi ke job release.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + protocol tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Native protocol regression tests
        run: |
          mkdir -p .ci-native
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic -pthread \
            -Iapp/src/main/cpp \
            app/src/main/cpp/client_rpc.cpp \
            app/src/main/cpp/client_sync.cpp \
            app/src/main/cpp/gta_img_archive.cpp \
            app/src/main/cpp/gta_collision.cpp \
            app/src/main/cpp/gta_collision_catalog.cpp \
            app/src/main/cpp/gta_collision_world.cpp \
            app/src/main/cpp/gta_data_runtime.cpp \
            app/src/main/cpp/gta_dff_mesh.cpp \
            app/src/main/cpp/gta_file_source.cpp \
            app/src/main/cpp/gta_map_manifest.cpp \
            app/src/main/cpp/gta_txd_texture.cpp \
            app/src/main/cpp/gta_vehicle_handling.cpp \
            app/src/main/cpp/input_state.cpp \
            app/src/main/cpp/local_gameplay_bridge.cpp \
            app/src/main/cpp/local_movement.cpp \
            app/src/main/cpp/local_vehicle_movement.cpp \
            app/src/main/cpp/local_player_sync.cpp \
            app/src/main/cpp/sync_decoder.cpp \
            app/src/main/cpp/raknet_codec.cpp \
            app/src/main/cpp/raknet_handshake.cpp \
            app/src/main/cpp/raknet_string_compressor.cpp \
            app/src/main/cpp/samp_query.cpp \
            app/src/main/cpp/rpc_decoder.cpp \
            app/src/main/cpp/rpc_state.cpp \
            app/src/main/cpp/raknet_probe.cpp \
            tests/native/raknet_codec_test.cpp \
            -o .ci-native/raknet-codec-test
          .ci-native/raknet-codec-test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner GitHub sudah menyediakan Android SDK di /usr/local/lib/android/sdk.
      # Jangan pakai android-actions/setup-android@v3: action itu masih memanggil
      # `sdkmanager tools`, padahal package "tools" sudah dihapus dari repository Google.
      - name: Install NDK + CMake + platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Google-hosted SDK archives occasionally arrive truncated on a fresh
          # runner (notably CMake's ZIP). Retry each package independently and
          # clear only its partial install plus the sdkmanager download cache,
          # so a transient archive failure cannot masquerade as an app failure.
          install_sdk_package() {
            package="$1"
            install_path="$2"
            for attempt in 1 2 3; do
              if sdkmanager --install "$package"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Gagal memasang $package setelah $attempt percobaan"
                return 1
              fi
              echo "SDK package $package gagal/korup; membersihkan partial lalu retry $attempt/3"
              rm -rf "$install_path" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
              sleep "$((attempt * 3))"
            done
          }

          install_sdk_package "platforms;android-34" "$ANDROID_HOME/platforms/android-34"
          install_sdk_package "build-tools;34.0.0" "$ANDROID_HOME/build-tools/34.0.0"
          install_sdk_package "ndk;26.1.10909125" "$ANDROID_HOME/ndk/26.1.10909125"
          install_sdk_package "cmake;3.22.1" "$ANDROID_HOME/cmake/3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Materialize official release keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 belum di-set"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD belum di-set"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS belum di-set"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD belum di-set"; exit 1; }
          mkdir -p .ci-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-signing/sampdroid-release.jks
          test -s .ci-signing/sampdroid-release.jks || { echo "::error::keystore release kosong"; exit 1; }
          keytool -list -keystore .ci-signing/sampdroid-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/.ci-signing/sampdroid-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK (armeabi-v7a + arm64-v8a)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Verify both ABIs are present
        run: |
          APK="$APK_PATH"
          test -f "$APK" || { echo "::error::APK tidak ditemukan: $APK"; exit 1; }
          echo "=== native libs di dalam APK ($APK_VARIANT) ==="
          unzip -l "$APK" | grep -E "lib/(armeabi-v7a|arm64-v8a)/"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libsampdroid.so" \
            || { echo "::error::armeabi-v7a tidak ada di APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsampdroid.so" \
            || { echo "::error::arm64-v8a tidak ada di APK"; exit 1; }
          if [[ "$APK_VARIANT" == "release" ]]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            echo "OK: APK release ditandatangani keystore resmi"
          fi
          echo "OK: kedua ABI terbundel"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SampDroid-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create draft GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SampDroid-apk
          path: release-assets

      - name: Give signed release APK a stable name
        run: |
          # upload-artifact may preserve subdirectories when the glob contains
          # `**`; find recursively rather than assuming a flat download.
          APK=$(find release-assets -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "::error::APK artifact tidak ditemukan"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          mv "$APK" "release-assets/SampDroid-${VERSION}-release.apk"

      - name: Create draft release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          # Tagged APKs must stay private until a maintainer reviews and
          # explicitly publishes the draft in GitHub's Releases UI.
          draft: true
          files: release-assets/*.apk
          generate_release_notes: true
