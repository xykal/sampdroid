name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PR build hanya perlu membaca source. Hak tulis release diisolasi ke job release.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + protocol tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Native protocol regression tests
        run: |
          mkdir -p .ci-native
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            -Iapp/src/main/cpp \
            app/src/main/cpp/client_rpc.cpp \
            app/src/main/cpp/client_sync.cpp \
            app/src/main/cpp/raknet_codec.cpp \
            app/src/main/cpp/rpc_decoder.cpp \
            app/src/main/cpp/rpc_state.cpp \
            app/src/main/cpp/raknet_probe.cpp \
            tests/native/raknet_codec_test.cpp \
            -o .ci-native/raknet-codec-test
          .ci-native/raknet-codec-test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner GitHub sudah menyediakan Android SDK di /usr/local/lib/android/sdk.
      # Jangan pakai android-actions/setup-android@v3: action itu masih memanggil
      # `sdkmanager tools`, padahal package "tools" sudah dihapus dari repository Google.
      - name: Install NDK + CMake + platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK (armeabi-v7a + arm64-v8a)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify both ABIs are present
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== native libs di dalam APK ==="
          unzip -l "$APK" | grep -E "lib/(armeabi-v7a|arm64-v8a)/"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libsampdroid.so" \
            || { echo "::error::armeabi-v7a tidak ada di APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsampdroid.so" \
            || { echo "::error::arm64-v8a tidak ada di APK"; exit 1; }
          echo "OK: kedua ABI terbundel"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SampDroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create draft GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SampDroid-debug
          path: release-assets

      - name: Give release APK a stable name
        run: |
          APK=$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "::error::APK artifact tidak ditemukan"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          mv "$APK" "release-assets/SampDroid-${VERSION}-debug.apk"

      - name: Create draft release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          # Tagged APKs must stay private until a maintainer reviews and
          # explicitly publishes the draft in GitHub's Releases UI.
          draft: true
          files: release-assets/*.apk
          generate_release_notes: true
