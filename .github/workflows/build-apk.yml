name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (armeabi-v7a + arm64-v8a)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify both ABIs are present
        run: |
          echo "=== native libs di dalam APK ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/(armeabi-v7a|arm64-v8a)/"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/armeabi-v7a/libsampdroid.so" \
            || { echo "::error::armeabi-v7a tidak ada di APK"; exit 1; }
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libsampdroid.so" \
            || { echo "::error::arm64-v8a tidak ada di APK"; exit 1; }
          echo "OK: kedua ABI terbundel"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SampDroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
