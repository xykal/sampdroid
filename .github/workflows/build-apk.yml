name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner GitHub sudah menyediakan Android SDK di /usr/local/lib/android/sdk.
      # Jangan pakai android-actions/setup-android@v3: action itu masih memanggil
      # `sdkmanager tools`, padahal package "tools" sudah dihapus dari repository Google.
      - name: Install NDK + CMake + platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (armeabi-v7a + arm64-v8a)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify both ABIs are present
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== native libs di dalam APK ==="
          unzip -l "$APK" | grep -E "lib/(armeabi-v7a|arm64-v8a)/"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libsampdroid.so" \
            || { echo "::error::armeabi-v7a tidak ada di APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsampdroid.so" \
            || { echo "::error::arm64-v8a tidak ada di APK"; exit 1; }
          echo "OK: kedua ABI terbundel"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SampDroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
