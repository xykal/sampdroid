name: Feature / improvement
description: Usulkan perbaikan untuk port client Android native.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah pengguna
      description: Masalah apa yang harus diselesaikan agar pemain tidak perlu Winlator/samp.exe di Android?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area port
      options: [Native session, RakNet/protocol, Player sync, World state, Android HUD, Native controls, Renderer/world bridge, ARMv7 performance, Documentation]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan
      description: Jelaskan behavior native Android yang diharapkan dan batas UI/API.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Usulan tidak membundel/mengunduh asset game atau proprietary binary.
          required: true
        - label: Usulan tidak membutuhkan Winlator, Wine, samp.exe, atau modpack PC.
          required: true
        - label: Usulan mempertimbangkan armeabi-v7a dan arm64-v8a.
          required: true
        - label: Usulan tidak meminta cheat, bypass, atau fitur merusak server.
          required: true
